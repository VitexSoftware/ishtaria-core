[package]
name = "ishtaria-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared simulation core of Ishtaria: identities, items with provenance, rulesets. Used by both server and client."
repository = "https://github.com/VitexSoftware/ishtaria-core"
authors = ["Vítězslav Dvořák <cybervitexus@gmail.com>"]
rust-version = "1.80"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
